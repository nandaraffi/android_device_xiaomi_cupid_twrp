name: Build TWRP 3.7.1 - Xiaomi 12 Cupid - Nndee V2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVICE: cupid

  TWRP_BRANCH: twrp-12.1

  DEVICE_BRANCH: lineage-23.2
  VENDOR_BRANCH: lineage-23.2

  DEVICE_TREE: LineageOS/android_device_xiaomi_cupid
  COMMON_TREE: LineageOS/android_device_xiaomi_sm8450-common

  VENDOR_TREE: TheMuppets/proprietary_vendor_xiaomi_cupid
  VENDOR_COMMON_TREE: TheMuppets/proprietary_vendor_xiaomi_sm8450-common

  TWRP_MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git

jobs:

  build:

    name: Build Xiaomi 12 Cupid TWRP

    runs-on: ubuntu-22.04

    timeout-minutes: 240

    steps:

      # ============================================================
      # 1. CHECKOUT USER REPOSITORY
      # ============================================================

      - name: Checkout Cupid TWRP repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. FREE DISK SPACE
      # ============================================================

      - name: Free runner disk space
        run: |
          set -eo pipefail

          echo "=========================================="
          echo "FREEING RUNNER DISK SPACE"
          echo "=========================================="

          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /usr/local/lib/android/sdk/cmake || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          echo
          echo "Disk:"
          df -h


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        run: |
          set -eo pipefail

          echo "=========================================="
          echo "INSTALLING BUILD DEPENDENCIES"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libc6-dev-i386 \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            python3 \
            python3-pip \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          sudo ln -sf /usr/bin/python3 /usr/local/bin/python

          echo
          python3 --version
          git --version


      # ============================================================
      # 4. INSTALL REPO
      # ============================================================

      - name: Install repo tool
        run: |
          set -eo pipefail

          echo "=========================================="
          echo "INSTALLING REPO TOOL"
          echo "=========================================="

          mkdir -p "${HOME}/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"

          chmod +x "${HOME}/bin/repo"

          # IMPORTANT:
          # GITHUB_PATH only affects following steps.
          # export PATH is required immediately in this shell.
          export PATH="${HOME}/bin:${PATH}"

          echo "${HOME}/bin" >> "${GITHUB_PATH}"

          echo
          echo "Repo path:"
          command -v repo

          echo
          echo "Repo version:"
          repo --version


      # ============================================================
      # 5. INITIALIZE TWRP
      # ============================================================

      - name: Initialize TWRP source
        run: |
          set -eo pipefail

          echo "=========================================="
          echo "INITIALIZING TWRP SOURCE"
          echo "=========================================="

          mkdir -p "${GITHUB_WORKSPACE}/twrp"

          cd "${GITHUB_WORKSPACE}/twrp"

          repo init \
            --depth=1 \
            -u "${TWRP_MANIFEST}" \
            -b "${TWRP_BRANCH}"

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"


      # ============================================================
      # 6. CREATE LOCAL MANIFEST
      # ============================================================

      - name: Create Cupid local manifest
        working-directory: twrp
        run: |
          set -eo pipefail

          echo "=========================================="
          echo "CREATING CUPID LOCAL MANIFEST"
          echo "=========================================="

          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/cupid.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>

            <!-- Xiaomi 12 Cupid -->
            <project
              name="${DEVICE_TREE}"
              path="device/xiaomi/cupid"
              remote="github"
              revision="${DEVICE_BRANCH}"
              clone-depth="1" />

            <!-- Xiaomi SM8450 Common -->
            <project
              name="${COMMON_TREE}"
              path="device/xiaomi/sm8450-common"
              remote="github"
              revision="${DEVICE_BRANCH}"
              clone-depth="1" />

            <!-- Xiaomi Cupid Vendor -->
            <project
              name="${VENDOR_TREE}"
              path="vendor/xiaomi/cupid"
              remote="github"
              revision="${VENDOR_BRANCH}"
              clone-depth="1" />

            <!-- Xiaomi SM8450 Common Vendor -->
            <project
              name="${VENDOR_COMMON_TREE}"
              path="vendor/xiaomi/sm8450-common"
              remote="github"
              revision="${VENDOR_BRANCH}"
              clone-depth="1" />

          </manifest>
          EOF

          echo
          echo "===== cupid.xml ====="
          cat .repo/local_manifests/cupid.xml


      # ============================================================
      # 7. SYNC SOURCE
      # ============================================================

      - name: Sync TWRP and Xiaomi source
        working-directory: twrp
        run: |
          set -eo pipefail

          echo "=========================================="
          echo "SYNCING SOURCE"
          echo "=========================================="

          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2


      # ============================================================
      # 8. VERIFY DEVICE TREE
      # ============================================================

      - name: Verify Cupid source trees
        working-directory: twrp
        run: |
          set -eo pipefail

          echo "=========================================="
          echo "VERIFYING CUPID SOURCE"
          echo "=========================================="

          test -d device/xiaomi/cupid
          test -d device/xiaomi/sm8450-common

          test -d vendor/xiaomi/cupid
          test -d vendor/xiaomi/sm8450-common

          test -f device/xiaomi/cupid/BoardConfig.mk
          test -f device/xiaomi/cupid/device.mk
          test -f device/xiaomi/cupid/AndroidProducts.mk
          test -f device/xiaomi/cupid/lineage_cupid.mk

          echo
          echo "Device tree       : OK"
          echo "SM8450 common     : OK"
          echo "Cupid vendor      : OK"
          echo "Vendor common     : OK"
          echo "BoardConfig.mk    : OK"
          echo "device.mk         : OK"
          echo "AndroidProducts   : OK"
          echo "lineage_cupid.mk  : OK"


      # ============================================================
      # 9. SHOW ORIGINAL DEVICE CONFIGURATION
      # ============================================================

      - name: Inspect original Cupid configuration
        working-directory: twrp
        run: |
          set -eo pipefail

          echo "=========================================="
          echo "ORIGINAL BOARD CONFIG"
          echo "=========================================="

          sed -n '1,260p' device/xiaomi/cupid/BoardConfig.mk

          echo
          echo "=========================================="
          echo "ORIGINAL DEVICE MK"
          echo "=========================================="

          sed -n '1,260p' device/xiaomi/cupid/device.mk

          echo
          echo "=========================================="
          echo "ORIGINAL PRODUCT MK"
          echo "=========================================="

          sed -n '1,260p' device/xiaomi/cupid/lineage_cupid.mk


      # ============================================================
      # 10. CREATE TWRP PRODUCT
      # ============================================================

      - name: Create TWRP Cupid product
        working-directory: twrp
        run: |
          set -eo pipefail

          DEVICE_PATH="device/xiaomi/cupid"

          echo "=========================================="
          echo "CREATING TWRP CUPID PRODUCT"
          echo "=========================================="

          cp \
            "${DEVICE_PATH}/lineage_cupid.mk" \
            "${DEVICE_PATH}/twrp_cupid.mk"

          # --------------------------------------------------------
          # Remove Lineage-only common product.
          # --------------------------------------------------------

          sed -i \
            '/vendor\/lineage\/config\/common_full_phone\.mk/d' \
            "${DEVICE_PATH}/twrp_cupid.mk"

          # --------------------------------------------------------
          # Change product name.
          # --------------------------------------------------------

          sed -i \
            's/PRODUCT_NAME[[:space:]]*:=[[:space:]]*lineage_cupid/PRODUCT_NAME := twrp_cupid/g' \
            "${DEVICE_PATH}/twrp_cupid.mk"

          # --------------------------------------------------------
          # Change Lineage product identifiers if present.
          # --------------------------------------------------------

          sed -i \
            's/lineage_cupid/twrp_cupid/g' \
            "${DEVICE_PATH}/twrp_cupid.mk"

          # --------------------------------------------------------
          # Add TWRP common configuration.
          # --------------------------------------------------------

          cat >> "${DEVICE_PATH}/twrp_cupid.mk" <<'EOF'

          # ========================================================
          # TWRP COMMON
          # ========================================================

          $(call inherit-product, vendor/twrp/config/common.mk)

          # Device
          PRODUCT_DEVICE := cupid
          PRODUCT_NAME := twrp_cupid

          PRODUCT_BRAND := Xiaomi
          PRODUCT_MODEL := 2201123G
          PRODUCT_MANUFACTURER := Xiaomi

          # TWRP custom branding
          TW_DEVICE_VERSION := Nndee V2

          EOF

          echo
          echo "===== twrp_cupid.mk ====="
          cat "${DEVICE_PATH}/twrp_cupid.mk"


      # ============================================================
      # 11. CREATE ANDROIDPRODUCTS.MK
      # ============================================================

      - name: Configure TWRP AndroidProducts
        working-directory: twrp
        run: |
          set -eo pipefail

          DEVICE_PATH="device/xiaomi/cupid"

          echo "=========================================="
          echo "CONFIGURING ANDROID PRODUCTS"
          echo "=========================================="

          cat > "${DEVICE_PATH}/AndroidProducts.mk" <<'EOF'
          #
          # Xiaomi 12 / Cupid
          # TWRP
          #

          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/twrp_cupid.mk

          COMMON_LUNCH_CHOICES := \
              twrp_cupid-eng
          EOF

          cat "${DEVICE_PATH}/AndroidProducts.mk"


      # ============================================================
      # 12. ADD TWRP BOARD CONFIG
      #
      # IMPORTANT:
      # No fake fstab.
      # No fake vendor_boot.
      # No forced OTG insmod.
      # ============================================================

      - name: Configure TWRP BoardConfig
        working-directory: twrp
        run: |
          set -eo pipefail

          DEVICE_PATH="device/xiaomi/cupid"

          echo "=========================================="
          echo "ADDING TWRP BOARD CONFIGURATION"
          echo "=========================================="

          cat >> "${DEVICE_PATH}/BoardConfig.mk" <<'EOF'

          # ========================================================
          # TWRP
          # ========================================================

          TW_THEME := portrait_hdpi

          TW_INCLUDE_FASTBOOTD := true

          TW_INCLUDE_NTFS_3G := true

          TW_INCLUDE_FUSE_EXFAT := true

          TW_EXTRA_LANGUAGES := true

          TW_USE_TOOLBOX := true

          TW_SCREEN_BLANK_ON_BOOT := true

          TW_INCLUDE_REPACKTOOLS := true

          EOF

          echo
          echo "===== TWRP BoardConfig additions ====="

          tail -80 "${DEVICE_PATH}/BoardConfig.mk"


      # ============================================================
      # 13. DISCOVER RECOVERY / VENDOR BOOT CONFIGURATION
      # ============================================================

      - name: Audit recovery configuration
        working-directory: twrp
        run: |
          set -eo pipefail

          echo "=========================================="
          echo "RECOVERY CONFIGURATION AUDIT"
          echo "=========================================="

          echo
          echo "---- Recovery references ----"

          grep -Rni \
            -E \
            "TARGET_RECOVERY|BOARD_RECOVERY|vendor_boot|recoveryimage" \
            device/xiaomi/cupid \
            device/xiaomi/sm8450-common \
            vendor/xiaomi/cupid \
            vendor/xiaomi/sm8450-common \
            2>/dev/null \
            | head -300 || true

          echo
          echo "---- FSTAB FILES ----"

          find \
            device/xiaomi/cupid \
            device/xiaomi/sm8450-common \
            vendor/xiaomi/cupid \
            vendor/xiaomi/sm8450-common \
            -type f \
            \( \
              -name "fstab*" \
              -o \
              -name "*fstab*" \
            \) \
            2>/dev/null \
            | sort \
            | head -300 || true


      # ============================================================
      # 14. AUDIT KERNEL MODULES / USB OTG
      #
      # Discovery only.
      # Nothing is force-loaded.
      # ============================================================

      - name: Audit USB OTG and kernel modules
        working-directory: twrp
        run: |
          set -eo pipefail

          echo "=========================================="
          echo "USB / OTG / KERNEL MODULE AUDIT"
          echo "=========================================="

          echo
          echo "---- modules.load files ----"

          find \
            device/xiaomi/cupid \
            device/xiaomi/sm8450-common \
            vendor/xiaomi/cupid \
            vendor/xiaomi/sm8450-common \
            -type f \
            \( \
              -name "modules.load*" \
              -o \
              -name "*modules*" \
            \) \
            2>/dev/null \
            | sort \
            | head -300 || true

          echo
          echo "---- USB / OTG references ----"

          grep -Rni \
            -E \
            "dwc3|usb|otg|fsa4480|ucsi|redriver|repeater|phy-msm" \
            device/xiaomi/cupid \
            device/xiaomi/sm8450-common \
            vendor/xiaomi/cupid \
            vendor/xiaomi/sm8450-common \
            2>/dev/null \
            | head -400 || true

          echo
          echo "---- Kernel modules (.ko) ----"

          find \
            vendor/xiaomi/cupid \
            vendor/xiaomi/sm8450-common \
            device/xiaomi/cupid \
            device/xiaomi/sm8450-common \
            -type f \
            -name "*.ko" \
            2>/dev/null \
            | sort \
            | head -400 || true


      # ============================================================
      # 15. AUDIT PARTITION CONFIGURATION
      # ============================================================

      - name: Audit Cupid partitions
        working-directory: twrp
        run: |
          set -eo pipefail

          echo "=========================================="
          echo "PARTITION CONFIGURATION AUDIT"
          echo "=========================================="

          grep -Rni \
            -E \
            "BOARD_(BOOT|RECOVERY|VENDOR_BOOT|DTBO|SUPER).*PARTITION_SIZE|dynamic_partitions|AB_OTA" \
            device/xiaomi/cupid \
            device/xiaomi/sm8450-common \
            vendor/xiaomi/cupid \
            vendor/xiaomi/sm8450-common \
            2>/dev/null \
            | head -400 || true


      # ============================================================
      # 16. VERIFY TWRP COMMON
      # ============================================================

      - name: Verify TWRP common configuration
        working-directory: twrp
        run: |
          set -eo pipefail

          echo "=========================================="
          echo "VERIFYING TWRP COMMON"
          echo "=========================================="

          test -f vendor/twrp/config/common.mk

          echo "vendor/twrp/config/common.mk : OK"


      # ============================================================
      # 17. CCACHE
      # ============================================================

      - name: Configure ccache
        run: |
          set -eo pipefail

          mkdir -p "${HOME}/.ccache"

          ccache --max-size=8G

          echo "USE_CCACHE=1" >> "${GITHUB_ENV}"
          echo "CCACHE_EXEC=$(command -v ccache)" >> "${GITHUB_ENV}"

          ccache --show-stats || true


      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: twrp-cupid-${{ env.TWRP_BRANCH }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            twrp-cupid-${{ env.TWRP_BRANCH }}-${{ runner.os }}-


      # ============================================================
      # 18. PREPARE BUILD ENVIRONMENT
      #
      # IMPORTANT:
      #
      # NEVER use:
      #
      #   set -u
      #
      # while sourcing build/envsetup.sh.
      #
      # AOSP/TWRP envsetup.sh references variables that may not
      # exist yet, including TOP and ZSH_VERSION.
      # ============================================================

      - name: Prepare build environment
        working-directory: twrp
        run: |
          set -eo pipefail

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "=========================================="
          echo "PREPARING TWRP BUILD ENVIRONMENT"
          echo "=========================================="

          echo
          echo "Sourcing build/envsetup.sh..."

          source build/envsetup.sh

          echo
          echo "envsetup.sh completed successfully."

          echo
          echo "=========================================="
          echo "LUNCH CUPID"
          echo "=========================================="

          lunch twrp_cupid-eng

          echo
          echo "=========================================="
          echo "BUILD VARIABLES"
          echo "=========================================="

          echo "TARGET_DEVICE=${TARGET_DEVICE:-unknown}"
          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-unknown}"
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT:-unknown}"

          echo
          echo "TARGET_DEVICE:"
          get_build_var TARGET_DEVICE || true

          echo
          echo "TARGET_PRODUCT:"
          get_build_var TARGET_PRODUCT || true

          echo
          echo "TARGET_BUILD_VARIANT:"
          get_build_var TARGET_BUILD_VARIANT || true


      # ============================================================
      # 19. BUILD
      #
      # Again, no set -u.
      # ============================================================

      - name: Build TWRP recoveryimage
        working-directory: twrp
        env:
          ALLOW_MISSING_DEPENDENCIES: true
          LC_ALL: C
        run: |
          set -eo pipefail

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "=========================================="
          echo "BUILDING TWRP RECOVERY"
          echo "=========================================="

          free -h
          df -h

          echo
          echo "Sourcing build environment..."

          source build/envsetup.sh

          echo
          echo "Running lunch..."

          lunch twrp_cupid-eng

          echo
          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="

          echo "Device   : Xiaomi 12"
          echo "Codename : cupid"
          echo "Model    : 2201123G"
          echo "TWRP     : ${TWRP_BRANCH}"
          echo "Branding : Nndee V2"

          echo
          echo "TARGET_DEVICE=${TARGET_DEVICE:-unknown}"
          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-unknown}"
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT:-unknown}"

          echo
          echo "=========================================="
          echo "STARTING RECOVERYIMAGE BUILD"
          echo "=========================================="

          mka recoveryimage -j2


      # ============================================================
      # 20. VERIFY RECOVERY
      # ============================================================

      - name: Verify recovery image
        working-directory: twrp
        run: |
          set -eo pipefail

          OUT="out/target/product/cupid"

          echo "=========================================="
          echo "VERIFYING BUILD OUTPUT"
          echo "=========================================="

          echo
          echo "Output directory:"
          ls -lah "${OUT}" || true

          echo
          echo "Searching recovery image..."

          find \
            out/target/product/cupid \
            -maxdepth 2 \
            -type f \
            \( \
              -name "recovery.img" \
              -o \
              -name "recovery-*.img" \
            \) \
            -print

          test -f "${OUT}/recovery.img"

          mkdir -p "${GITHUB_WORKSPACE}/output"

          cp \
            "${OUT}/recovery.img" \
            "${GITHUB_WORKSPACE}/output/recovery.img"

          sha256sum \
            "${GITHUB_WORKSPACE}/output/recovery.img" \
            | tee "${GITHUB_WORKSPACE}/output/recovery.img.sha256"

          echo
          echo "Recovery image:"
          ls -lh "${GITHUB_WORKSPACE}/output/recovery.img"


      # ============================================================
      # 21. DETECT TWRP VERSION
      # ============================================================

      - name: Generate build information
        working-directory: twrp
        run: |
          set -eo pipefail

          echo "=========================================="
          echo "GENERATING BUILD INFORMATION"
          echo "=========================================="

          VERSION="unknown"

          if [ -f bootable/recovery/variables.h ]; then

            DETECTED_VERSION="$(
              grep \
                -E \
                '#define[[:space:]]+TW_VERSION_STR' \
                bootable/recovery/variables.h \
                2>/dev/null \
                | head -1 \
                | sed \
                  's/.*TW_VERSION_STR[[:space:]]*//' \
                | tr -d '"' \
                || true
            )"

            if [ -n "${DETECTED_VERSION}" ]; then
              VERSION="${DETECTED_VERSION}"
            fi

          fi

          mkdir -p "${GITHUB_WORKSPACE}/output"

          cat > "${GITHUB_WORKSPACE}/output/BUILD_INFO.txt" <<EOF
          ==========================================
          TWRP Xiaomi 12 / Cupid
          ==========================================

          Device:
          Xiaomi 12

          Codename:
          cupid

          Model:
          2201123G

          TWRP source:
          ${TWRP_BRANCH}

          Device tree:
          ${DEVICE_TREE}

          Device branch:
          ${DEVICE_BRANCH}

          Vendor:
          ${VENDOR_BRANCH}

          Detected TWRP version:
          ${VERSION}

          Custom branding:
          ${VERSION} - Nndee V2

          Build system:
          GitHub Actions

          ==========================================
          OTG STATUS
          ==========================================

          OTG was NOT force-patched during this build.

          USB/OTG modules and recovery configuration were
          audited from the actual Cupid/vendor source.

          Further OTG modification will only be made after
          successful recovery build/testing and evidence from
          the actual recovery environment.

          ==========================================
          EOF

          cat "${GITHUB_WORKSPACE}/output/BUILD_INFO.txt"


      # ============================================================
      # 22. UPLOAD RECOVERY
      # ============================================================

      - name: Upload TWRP recovery
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-cupid-Nndee-V2
          path: |
            output/recovery.img
            output/recovery.img.sha256
            output/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 23. ALWAYS UPLOAD DEVICE CONFIG
      #
      # Useful if build fails after device tree modifications.
      # ============================================================

      - name: Upload Cupid debug configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cupid-device-tree-debug
          path: |
            twrp/device/xiaomi/cupid/BoardConfig.mk
            twrp/device/xiaomi/cupid/device.mk
            twrp/device/xiaomi/cupid/AndroidProducts.mk
            twrp/device/xiaomi/cupid/lineage_cupid.mk
            twrp/device/xiaomi/cupid/twrp_cupid.mk
          if-no-files-found: warn
          retention-days: 14

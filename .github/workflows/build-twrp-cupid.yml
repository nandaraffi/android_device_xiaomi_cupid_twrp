name: Build Xiaomi 12 Cupid TWRP

on:
  workflow_dispatch:

env:
  DEVICE: cupid
  DEVICE_NAME: Xiaomi 12
  TWRP_BRANCH: twrp-12.1

  # YOUR OWN DEVICE TREE
  DEVICE_TREE: nandaraffi/twrp_device_xiaomi_cupid
  DEVICE_TREE_BRANCH: main

jobs:
  build:
    name: Build Xiaomi 12 Cupid TWRP
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            rsync \
            unzip \
            zip \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            g++ \
            gcc \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libxml2-utils \
            lzop \
            pngcrush \
            python3 \
            python3-pip \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zlib1g-dev

      - name: Install repo tool
        shell: bash
        run: |
          set -e

          mkdir -p "${HOME}/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"

          chmod a+x "${HOME}/bin/repo"

          echo "${HOME}/bin" >> "${GITHUB_PATH}"

          "${HOME}/bin/repo" --version

      - name: Initialize TWRP 12.1
        shell: bash
        run: |
          set -e

          mkdir -p "${GITHUB_WORKSPACE}/twrp"

          cd "${GITHUB_WORKSPACE}/twrp"

          export PATH="${HOME}/bin:${PATH}"

          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b "${TWRP_BRANCH}" \
            --depth=1

      - name: Sync TWRP source
        shell: bash
        run: |
          set -e

          cd "${GITHUB_WORKSPACE}/twrp"

          export PATH="${HOME}/bin:${PATH}"

          repo sync \
            -c \
            -j2 \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      - name: Clone YOUR Xiaomi 12 device tree
        shell: bash
        run: |
          set -e

          cd "${GITHUB_WORKSPACE}/twrp"

          echo "=============================================="
          echo "CLONING DEVICE TREE"
          echo "=============================================="

          echo "Repository : https://github.com/${DEVICE_TREE}"
          echo "Branch     : ${DEVICE_TREE_BRANCH}"
          echo "Target     : device/xiaomi/${DEVICE}"

          rm -rf "device/xiaomi/${DEVICE}"

          git clone \
            --depth=1 \
            --branch "${DEVICE_TREE_BRANCH}" \
            "https://github.com/${DEVICE_TREE}.git" \
            "device/xiaomi/${DEVICE}"

          echo
          echo "=============================================="
          echo "DEVICE TREE CONTENT"
          echo "=============================================="

          ls -lah "device/xiaomi/${DEVICE}"

      - name: Verify device tree
        shell: bash
        run: |
          set -e

          cd "${GITHUB_WORKSPACE}/twrp"

          DEVICE_PATH="device/xiaomi/${DEVICE}"

          echo "=============================================="
          echo "VERIFYING DEVICE TREE"
          echo "=============================================="

          test -f "${DEVICE_PATH}/AndroidProducts.mk"
          test -f "${DEVICE_PATH}/twrp_cupid.mk"
          test -f "${DEVICE_PATH}/device.mk"
          test -f "${DEVICE_PATH}/BoardConfig.mk"
          test -f "${DEVICE_PATH}/prebuilt/kernel"
          test -f "${DEVICE_PATH}/modules.load.recovery"

          echo "All required Cupid files found."

          echo
          echo "Git information:"
          cd "${DEVICE_PATH}"

          git remote -v
          git branch --show-current
          git log -1 --oneline

      - name: Show device configuration
        shell: bash
        run: |
          set -e

          cd "${GITHUB_WORKSPACE}/twrp"

          echo "=============================================="
          echo "BUILD CONFIGURATION"
          echo "=============================================="

          echo "Device        : ${DEVICE_NAME}"
          echo "Codename      : ${DEVICE}"
          echo "TWRP branch   : ${TWRP_BRANCH}"
          echo "Device tree   : ${DEVICE_TREE}"
          echo "DT branch     : ${DEVICE_TREE_BRANCH}"
          echo "Kernel        : Prebuilt"

          echo
          echo "Runner:"
          uname -a

          echo
          echo "Memory:"
          free -h

          echo
          echo "Storage:"
          df -h

      - name: Prepare TWRP build environment
        shell: bash
        run: |
          set -eo pipefail

          cd "${GITHUB_WORKSPACE}/twrp"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          # IMPORTANT:
          # Do not enable 'set -u' before sourcing envsetup.sh.
          # Android/TWRP envsetup uses variables that may initially
          # be undefined.

          source build/envsetup.sh

          lunch twrp_cupid-eng

          echo
          echo "=============================================="
          echo "TARGET INFORMATION"
          echo "=============================================="

          echo "TARGET_PRODUCT:"
          get_build_var TARGET_PRODUCT

          echo "TARGET_BUILD_VARIANT:"
          get_build_var TARGET_BUILD_VARIANT

          echo "PRODUCT_DEVICE:"
          get_build_var PRODUCT_DEVICE

          echo "TARGET_ARCH:"
          get_build_var TARGET_ARCH

          echo "TARGET_BOARD_PLATFORM:"
          get_build_var TARGET_BOARD_PLATFORM

          echo "OUT_DIR:"
          get_build_var OUT_DIR

      - name: Build TWRP recovery
        shell: bash
        run: |
          set -eo pipefail

          cd "${GITHUB_WORKSPACE}/twrp"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh

          lunch twrp_cupid-eng

          echo
          echo "=============================================="
          echo "BUILDING TWRP"
          echo "=============================================="

          echo "Device      : Xiaomi 12"
          echo "Codename    : cupid"
          echo "TWRP        : ${TWRP_BRANCH}"
          echo "Device Tree : ${DEVICE_TREE}"
          echo "DT Branch   : ${DEVICE_TREE_BRANCH}"

          echo
          echo "Starting build..."

          mka recoveryimage \
            ALLOW_MISSING_DEPENDENCIES=true \
            -j2

      - name: Verify recovery image
        shell: bash
        run: |
          set -e

          cd "${GITHUB_WORKSPACE}/twrp"

          RECOVERY="out/target/product/cupid/recovery.img"

          echo "=============================================="
          echo "VERIFYING BUILD OUTPUT"
          echo "=============================================="

          if [ ! -f "${RECOVERY}" ]; then
            echo "ERROR: recovery.img was not generated."
            echo
            echo "Available output:"
            ls -lah out/target/product/cupid/ || true
            exit 1
          fi

          echo
          echo "BUILD SUCCESSFUL"
          echo

          echo "Recovery:"
          ls -lh "${RECOVERY}"

          echo
          echo "File type:"
          file "${RECOVERY}"

          echo
          echo "SHA256:"
          sha256sum "${RECOVERY}"

      - name: Create build information
        shell: bash
        run: |
          set -e

          cd "${GITHUB_WORKSPACE}/twrp"

          mkdir -p build-info

          cat > build-info/build-info.txt <<EOF
          ==========================================
          Xiaomi 12 Cupid TWRP Build
          ==========================================

          Device       : Xiaomi 12
          Codename     : cupid

          TWRP Branch  : ${TWRP_BRANCH}

          Device Tree  : ${DEVICE_TREE}
          DT Branch    : ${DEVICE_TREE_BRANCH}

          Build Date   : $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ==========================================
          DEVICE TREE COMMIT
          ==========================================

          $(cd device/xiaomi/cupid && git log -1 --format='%H%n%ad%n%s' --date=iso)

          ==========================================
          RECOVERY IMAGE
          ==========================================

          $(ls -lh out/target/product/cupid/recovery.img)

          ==========================================
          SHA256
          ==========================================

          $(sha256sum out/target/product/cupid/recovery.img)
          EOF

          cat build-info/build-info.txt

      - name: Upload TWRP recovery
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-12-Cupid-TWRP
          path: |
            twrp/out/target/product/cupid/recovery.img
            twrp/build-info/build-info.txt
          if-no-files-found: error
          retention-days: 30

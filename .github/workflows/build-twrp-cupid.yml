name: Build Xiaomi 12 Cupid TWRP

on:
  workflow_dispatch:

env:
  DEVICE: cupid
  DEVICE_NAME: Xiaomi 12
  TWRP_BRANCH: twrp-12.1
  DEVICE_TREE: yarpiin/twrp_device_xiaomi_cupid

jobs:
  build:
    name: Build Xiaomi 12 Cupid TWRP
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            rsync \
            unzip \
            zip \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            g++ \
            gcc \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libxml2-utils \
            lzop \
            pngcrush \
            python3 \
            python3-pip \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zlib1g-dev

      - name: Install repo tool
        shell: bash
        run: |
          set -e

          mkdir -p "${HOME}/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"

          chmod a+x "${HOME}/bin/repo"

          echo "${HOME}/bin" >> "${GITHUB_PATH}"

          "${HOME}/bin/repo" --version

      - name: Initialize TWRP source
        shell: bash
        run: |
          set -e

          mkdir -p "${GITHUB_WORKSPACE}/twrp"
          cd "${GITHUB_WORKSPACE}/twrp"

          export PATH="${HOME}/bin:${PATH}"

          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b "${TWRP_BRANCH}" \
            --depth=1

      - name: Sync TWRP source
        shell: bash
        run: |
          set -e

          cd "${GITHUB_WORKSPACE}/twrp"

          export PATH="${HOME}/bin:${PATH}"

          repo sync \
            -c \
            -j2 \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      - name: Add Xiaomi 12 Cupid TWRP device tree
        shell: bash
        run: |
          set -e

          cd "${GITHUB_WORKSPACE}/twrp"

          rm -rf device/xiaomi/cupid

          git clone \
            --depth=1 \
            https://github.com/${DEVICE_TREE}.git \
            device/xiaomi/cupid

          echo "=============================================="
          echo "CUPID DEVICE TREE"
          echo "=============================================="

          ls -la device/xiaomi/cupid

          echo
          echo "Checking required files..."

          test -f device/xiaomi/cupid/AndroidProducts.mk
          test -f device/xiaomi/cupid/twrp_cupid.mk
          test -f device/xiaomi/cupid/device.mk
          test -f device/xiaomi/cupid/BoardConfig.mk
          test -f device/xiaomi/cupid/prebuilt/kernel

          echo
          echo "Device tree OK."

      - name: Show build configuration
        shell: bash
        run: |
          set -e

          cd "${GITHUB_WORKSPACE}/twrp"

          echo "=============================================="
          echo "BUILD CONFIGURATION"
          echo "=============================================="

          echo "Device       : ${DEVICE_NAME}"
          echo "Codename     : ${DEVICE}"
          echo "SoC          : Snapdragon 8 Gen 1 / SM8450"
          echo "Platform     : taro"
          echo "TWRP         : ${TWRP_BRANCH}"
          echo "Device Tree  : ${DEVICE_TREE}"
          echo "Kernel       : Prebuilt"
          echo "Build Host   : $(uname -a)"

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

      - name: Prepare build environment
        shell: bash
        run: |
          set -eo pipefail

          cd "${GITHUB_WORKSPACE}/twrp"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          # Do NOT use 'set -u' here.
          # Android/TWRP envsetup scripts expect some variables
          # to be undefined while they initialize the environment.

          source build/envsetup.sh

          lunch twrp_cupid-eng

          echo
          echo "=============================================="
          echo "TARGET CONFIGURATION"
          echo "=============================================="

          get_build_var TARGET_PRODUCT
          get_build_var TARGET_BUILD_VARIANT
          get_build_var TARGET_ARCH
          get_build_var TARGET_BOARD_PLATFORM
          get_build_var PRODUCT_DEVICE
          get_build_var OUT_DIR

      - name: Build TWRP recoveryimage
        shell: bash
        run: |
          set -eo pipefail

          cd "${GITHUB_WORKSPACE}/twrp"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh
          lunch twrp_cupid-eng

          echo
          echo "=============================================="
          echo "BUILDING TWRP RECOVERY"
          echo "=============================================="

          echo "Device      : Xiaomi 12"
          echo "Codename    : cupid"
          echo "Platform    : taro"
          echo "TWRP branch : ${TWRP_BRANCH}"

          echo
          echo "Starting build..."

          mka recoveryimage ALLOW_MISSING_DEPENDENCIES=true -j2

      - name: Verify recovery image
        shell: bash
        run: |
          set -e

          cd "${GITHUB_WORKSPACE}/twrp"

          echo "=============================================="
          echo "VERIFY RECOVERY IMAGE"
          echo "=============================================="

          RECOVERY="out/target/product/cupid/recovery.img"

          if [ ! -f "${RECOVERY}" ]; then
            echo "ERROR: recovery.img was not generated."
            echo
            echo "Output directory:"
            ls -lah out/target/product/cupid/ || true
            exit 1
          fi

          echo
          echo "SUCCESS!"
          echo
          echo "Recovery image:"
          ls -lh "${RECOVERY}"

          echo
          echo "File information:"
          file "${RECOVERY}"

          echo
          echo "SHA256:"
          sha256sum "${RECOVERY}"

      - name: Generate build information
        shell: bash
        run: |
          set -e

          cd "${GITHUB_WORKSPACE}/twrp"

          mkdir -p build-info

          cat > build-info/build-info.txt <<EOF
          Device       : Xiaomi 12
          Codename     : cupid
          SoC          : Qualcomm Snapdragon 8 Gen 1
          Platform     : taro
          TWRP         : ${TWRP_BRANCH}
          Device Tree  : ${DEVICE_TREE}
          Build Date   : $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Runner       : $(uname -a)

          Recovery:
          $(ls -lh out/target/product/cupid/recovery.img)

          SHA256:
          $(sha256sum out/target/product/cupid/recovery.img)
          EOF

          cat build-info/build-info.txt

      - name: Upload TWRP recovery
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-12-Cupid-TWRP
          path: |
            twrp/out/target/product/cupid/recovery.img
            twrp/build-info/build-info.txt
          if-no-files-found: error
          retention-days: 30

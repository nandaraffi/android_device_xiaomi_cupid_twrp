name: Build TWRP 3.7.1 - Xiaomi 12 Cupid - Nndee V2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVICE: cupid
  TWRP_BRANCH: twrp-12.1
  DEVICE_BRANCH: lineage-23.2
  VENDOR_BRANCH: lineage-23.2

  DEVICE_TREE: LineageOS/android_device_xiaomi_cupid
  COMMON_TREE: LineageOS/android_device_xiaomi_sm8450-common
  VENDOR_TREE: TheMuppets/proprietary_vendor_xiaomi_cupid
  VENDOR_COMMON_TREE: TheMuppets/proprietary_vendor_xiaomi_sm8450-common

  TWRP_MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git

jobs:
  build:
    name: Build cupid recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:

      # ==========================================================
      # 1. CHECKOUT USER REPOSITORY
      # ==========================================================

      - name: Checkout Cupid TWRP repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. FREE DISK SPACE
      # ==========================================================

      - name: Free runner disk space
        run: |
          set -eux

          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /usr/local/lib/android/sdk/cmake || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          df -h

      # ==========================================================
      # 3. INSTALL BUILD DEPENDENCIES
      # ==========================================================

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libc6-dev-i386 \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            python3 \
            python3-pip \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          sudo ln -sf /usr/bin/python3 /usr/local/bin/python

          python3 --version
          git --version
          curl --version | head -1

      # ==========================================================
      # 4. INSTALL REPO
      #
      # IMPORTANT:
      # export PATH is required in the current shell.
      # GITHUB_PATH is required for subsequent steps.
      # ==========================================================

      - name: Install repo tool
        run: |
          set -eux

          mkdir -p "${HOME}/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"

          chmod +x "${HOME}/bin/repo"

          export PATH="${HOME}/bin:${PATH}"

          echo "${HOME}/bin" >> "${GITHUB_PATH}"

          echo "repo:"
          command -v repo

          echo "repo version:"
          repo --version

      # ==========================================================
      # 5. INITIALIZE TWRP SOURCE
      # ==========================================================

      - name: Initialize TWRP source
        run: |
          set -eux

          mkdir -p "${GITHUB_WORKSPACE}/twrp"

          cd "${GITHUB_WORKSPACE}/twrp"

          repo init \
            --depth=1 \
            -u "${TWRP_MANIFEST}" \
            -b "${TWRP_BRANCH}"

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # ==========================================================
      # 6. CREATE LOCAL MANIFEST
      # ==========================================================

      - name: Create Cupid local manifest
        working-directory: twrp
        run: |
          set -eux

          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/cupid.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>

            <!-- Xiaomi 12 / Cupid -->
            <project
              name="${DEVICE_TREE}"
              path="device/xiaomi/cupid"
              remote="github"
              revision="${DEVICE_BRANCH}"
              clone-depth="1" />

            <!-- Xiaomi SM8450 common -->
            <project
              name="${COMMON_TREE}"
              path="device/xiaomi/sm8450-common"
              remote="github"
              revision="${DEVICE_BRANCH}"
              clone-depth="1" />

            <!-- Cupid proprietary vendor -->
            <project
              name="${VENDOR_TREE}"
              path="vendor/xiaomi/cupid"
              remote="github"
              revision="${VENDOR_BRANCH}"
              clone-depth="1" />

            <!-- SM8450 common proprietary vendor -->
            <project
              name="${VENDOR_COMMON_TREE}"
              path="vendor/xiaomi/sm8450-common"
              remote="github"
              revision="${VENDOR_BRANCH}"
              clone-depth="1" />

          </manifest>
          EOF

          echo "===== LOCAL MANIFEST ====="
          cat .repo/local_manifests/cupid.xml

      # ==========================================================
      # 7. SYNC
      # ==========================================================

      - name: Sync TWRP and Cupid source
        working-directory: twrp
        run: |
          set -eux

          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2

      # ==========================================================
      # 8. VERIFY SOURCE TREES
      # ==========================================================

      - name: Verify Cupid source trees
        working-directory: twrp
        run: |
          set -eux

          echo "=========================================="
          echo "SOURCE TREE VALIDATION"
          echo "=========================================="

          test -d device/xiaomi/cupid
          test -d device/xiaomi/sm8450-common

          test -d vendor/xiaomi/cupid
          test -d vendor/xiaomi/sm8450-common

          test -f device/xiaomi/cupid/BoardConfig.mk
          test -f device/xiaomi/cupid/device.mk
          test -f device/xiaomi/cupid/AndroidProducts.mk
          test -f device/xiaomi/cupid/lineage_cupid.mk

          echo "Cupid device tree       : OK"
          echo "SM8450 common device   : OK"
          echo "Cupid vendor            : OK"
          echo "SM8450 common vendor   : OK"
          echo "BoardConfig             : OK"
          echo "device.mk               : OK"
          echo "AndroidProducts.mk      : OK"
          echo "lineage_cupid.mk        : OK"

          echo
          echo "===== Cupid BoardConfig ====="
          sed -n '1,220p' device/xiaomi/cupid/BoardConfig.mk

          echo
          echo "===== Cupid device.mk ====="
          sed -n '1,220p' device/xiaomi/cupid/device.mk

      # ==========================================================
      # 9. CREATE TWRP PRODUCT
      #
      # We DO NOT modify the original Lineage product.
      # We create a separate twrp_cupid.mk.
      #
      # TWRP requires the product/dependencies to use twrp prefix.
      # ==========================================================

      - name: Create TWRP Cupid product
        working-directory: twrp
        run: |
          set -eux

          DEVICE_PATH="device/xiaomi/cupid"

          cp \
            "${DEVICE_PATH}/lineage_cupid.mk" \
            "${DEVICE_PATH}/twrp_cupid.mk"

          # Remove Lineage-specific common product.
          sed -i \
            '/vendor\/lineage\/config\/common_full_phone\.mk/d' \
            "${DEVICE_PATH}/twrp_cupid.mk"

          # Replace product name.
          sed -i \
            's/PRODUCT_NAME := lineage_cupid/PRODUCT_NAME := twrp_cupid/g' \
            "${DEVICE_PATH}/twrp_cupid.mk"

          # Add TWRP common configuration.
          cat >> "${DEVICE_PATH}/twrp_cupid.mk" <<'EOF'

          # TWRP common configuration
          $(call inherit-product, vendor/twrp/config/common.mk)

          # Device identity
          PRODUCT_DEVICE := cupid
          PRODUCT_NAME := twrp_cupid
          PRODUCT_BRAND := Xiaomi
          PRODUCT_MODEL := 2201123G
          PRODUCT_MANUFACTURER := Xiaomi

          # TWRP branding
          TW_DEVICE_VERSION := Nndee V2
          EOF

          echo "===== twrp_cupid.mk ====="
          cat "${DEVICE_PATH}/twrp_cupid.mk"

      # ==========================================================
      # 10. CREATE ANDROID PRODUCTS
      # ==========================================================

      - name: Configure TWRP AndroidProducts
        working-directory: twrp
        run: |
          set -eux

          DEVICE_PATH="device/xiaomi/cupid"

          cat > "${DEVICE_PATH}/AndroidProducts.mk" <<'EOF'
          #
          # Xiaomi 12 / Cupid
          # TWRP product
          #

          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/twrp_cupid.mk

          COMMON_LUNCH_CHOICES := \
              twrp_cupid-eng
          EOF

          echo "===== AndroidProducts.mk ====="
          cat "${DEVICE_PATH}/AndroidProducts.mk"

      # ==========================================================
      # 11. ADD ONLY SAFE TWRP FLAGS
      #
      # NO fake fstab.
      # NO forced OTG insmod.
      # NO guessed module list.
      # ==========================================================

      - name: Configure TWRP recovery flags
        working-directory: twrp
        run: |
          set -eux

          DEVICE_PATH="device/xiaomi/cupid"

          cat >> "${DEVICE_PATH}/BoardConfig.mk" <<'EOF'

          # ==========================================================
          # TWRP configuration
          # ==========================================================

          TW_THEME := portrait_hdpi

          TW_INCLUDE_FASTBOOTD := true

          TW_INCLUDE_NTFS_3G := true

          TW_INCLUDE_FUSE_EXFAT := true

          TW_EXTRA_LANGUAGES := true

          TW_USE_TOOLBOX := true

          TW_EXCLUDE_DEFAULT_USB_INIT := true

          TW_SCREEN_BLANK_ON_BOOT := true

          # A/B device
          TW_INCLUDE_REPACKTOOLS := true

          EOF

          echo "===== TWRP additions ====="

          tail -40 "${DEVICE_PATH}/BoardConfig.mk"

      # ==========================================================
      # 12. DETECT RECOVERY ARCHITECTURE
      #
      # Do not assume where recovery lives.
      # We inspect the actual Cupid tree/common tree.
      # ==========================================================

      - name: Detect recovery layout
        working-directory: twrp
        run: |
          set -eux

          echo "=========================================="
          echo "RECOVERY LAYOUT"
          echo "=========================================="

          echo
          echo "--- Recovery references ---"

          grep -Rni \
            -E \
            "TARGET_RECOVERY_FSTAB|BOARD_RECOVERY|vendor_boot|RECOVERY_KERNEL_MODULES" \
            device/xiaomi/cupid \
            device/xiaomi/sm8450-common \
            2>/dev/null \
            | head -200 || true

          echo
          echo "--- fstab files ---"

          find \
            device/xiaomi/cupid \
            device/xiaomi/sm8450-common \
            vendor/xiaomi/cupid \
            vendor/xiaomi/sm8450-common \
            -type f \
            \( \
              -name "fstab*" \
              -o \
              -name "*fstab*" \
            \) \
            2>/dev/null \
            | sort \
            | head -200 || true

      # ==========================================================
      # 13. DETECT KERNEL MODULE CONFIGURATION
      #
      # This is deliberately discovery only.
      # We do not inject modules yet.
      # ==========================================================

      - name: Audit kernel and USB OTG modules
        working-directory: twrp
        run: |
          set -eux

          echo "=========================================="
          echo "KERNEL / USB / OTG AUDIT"
          echo "=========================================="

          echo
          echo "--- Kernel module lists ---"

          find \
            device/xiaomi/cupid \
            device/xiaomi/sm8450-common \
            vendor/xiaomi/cupid \
            vendor/xiaomi/sm8450-common \
            -type f \
            \( \
              -name "modules.load*" \
              -o \
              -name "*modules*" \
            \) \
            2>/dev/null \
            | sort \
            | head -300 || true

          echo
          echo "--- USB / OTG references ---"

          grep -Rni \
            -E \
            "dwc3|usb|otg|fsa4480|ucsi|redriver|repeater|phy-msm" \
            device/xiaomi/cupid \
            device/xiaomi/sm8450-common \
            vendor/xiaomi/cupid \
            vendor/xiaomi/sm8450-common \
            2>/dev/null \
            | head -300 || true

          echo
          echo "--- Existing .ko files ---"

          find \
            vendor/xiaomi/cupid \
            vendor/xiaomi/sm8450-common \
            -type f \
            -name "*.ko" \
            2>/dev/null \
            | sort \
            | head -300 || true

      # ==========================================================
      # 14. DETECT PARTITION INFORMATION
      # ==========================================================

      - name: Audit Cupid partitions
        working-directory: twrp
        run: |
          set -eux

          echo "=========================================="
          echo "PARTITION AUDIT"
          echo "=========================================="

          grep -Rni \
            -E \
            "BOARD_(BOOT|RECOVERY|VENDOR_BOOT|DTBO|SUPER).*PARTITION_SIZE|TARGET_RECOVERY_FSTAB|dynamic_partitions" \
            device/xiaomi/cupid \
            device/xiaomi/sm8450-common \
            vendor/xiaomi/cupid \
            vendor/xiaomi/sm8450-common \
            2>/dev/null \
            | head -300 || true

      # ==========================================================
      # 15. CHECK TWRP COMMON CONFIG
      # ==========================================================

      - name: Verify TWRP common configuration
        working-directory: twrp
        run: |
          set -eux

          test -f vendor/twrp/config/common.mk

          echo "TWRP common configuration:"
          echo "vendor/twrp/config/common.mk : OK"

          grep -n \
            -E \
            "TW_|PRODUCT_NAME|PRODUCT_DEVICE" \
            vendor/twrp/config/common.mk \
            2>/dev/null \
            | head -100 || true

      # ==========================================================
      # 16. SETUP CCACHE
      # ==========================================================

      - name: Configure ccache
        run: |
          set -eux

          mkdir -p "${HOME}/.ccache"

          ccache --max-size=8G

          echo "USE_CCACHE=1" >> "${GITHUB_ENV}"
          echo "CCACHE_EXEC=$(command -v ccache)" >> "${GITHUB_ENV}"

          ccache --show-config || true
          ccache --show-stats || true

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: twrp-cupid-${{ env.TWRP_BRANCH }}-${{ runner.os }}
          restore-keys: |
            twrp-cupid-${{ env.TWRP_BRANCH }}-

      # ==========================================================
      # 17. BUILD ENVIRONMENT
      # ==========================================================

      - name: Prepare build environment
        working-directory: twrp
        run: |
          set -eux

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh

          lunch twrp_cupid-eng

          echo
          echo "=========================================="
          echo "BUILD VARIABLES"
          echo "=========================================="

          echo "TARGET_DEVICE=${TARGET_DEVICE:-unknown}"
          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-unknown}"
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT:-unknown}"

      # ==========================================================
      # 18. BUILD RECOVERY
      # ==========================================================

      - name: Build TWRP recoveryimage
        working-directory: twrp
        env:
          ALLOW_MISSING_DEPENDENCIES: true
          LC_ALL: C
        run: |
          set -eux

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh

          lunch twrp_cupid-eng

          echo
          echo "=========================================="
          echo "BUILDING TWRP"
          echo "DEVICE : XIAOMI 12"
          echo "CODENAME : CUPID"
          echo "BRANDING : Nndee V2"
          echo "=========================================="

          free -h
          df -h

          mka recoveryimage -j2

      # ==========================================================
      # 19. VERIFY OUTPUT
      # ==========================================================

      - name: Verify recovery output
        working-directory: twrp
        run: |
          set -eux

          OUT="out/target/product/cupid"

          echo "=========================================="
          echo "BUILD OUTPUT"
          echo "=========================================="

          find "${OUT}" \
            -maxdepth 1 \
            -type f \
            -printf "%f %s bytes\n" \
            2>/dev/null \
            | sort || true

          test -f "${OUT}/recovery.img"

          mkdir -p "${GITHUB_WORKSPACE}/output"

          cp \
            "${OUT}/recovery.img" \
            "${GITHUB_WORKSPACE}/output/recovery.img"

          sha256sum \
            "${GITHUB_WORKSPACE}/output/recovery.img" \
            | tee "${GITHUB_WORKSPACE}/output/recovery.img.sha256"

          stat \
            "${GITHUB_WORKSPACE}/output/recovery.img"

      # ==========================================================
      # 20. BRANDING INFORMATION
      # ==========================================================

      - name: Create build information
        working-directory: twrp
        run: |
          set -eux

          VERSION="unknown"

          if [ -f bootable/recovery/variables.h ]; then
            VERSION="$(grep -E \
              '#define TW_VERSION_STR' \
              bootable/recovery/variables.h \
              | head -1 \
              | sed 's/.*TW_VERSION_STR[[:space:]]*//' \
              | tr -d '"' \
              || true)"
          fi

          if [ -z "${VERSION}" ]; then
            VERSION="unknown"
          fi

          cat > "${GITHUB_WORKSPACE}/output/BUILD_INFO.txt" <<EOF
          TWRP Xiaomi 12 / Cupid

          TWRP source branch: ${TWRP_BRANCH}
          Device tree branch: ${DEVICE_BRANCH}
          Vendor branch: ${VENDOR_BRANCH}

          Device: cupid
          Model: 2201123G
          Manufacturer: Xiaomi

          Branding:
          ${VERSION} - Nndee V2

          Build:
          GitHub Actions

          OTG:
          Not force-patched in this build.
          OTG configuration is audited from the actual
          Cupid/vendor tree and will be fixed from verified
          recovery/kernel/module evidence after the first
          successful recovery build/test.
          EOF

          cat "${GITHUB_WORKSPACE}/output/BUILD_INFO.txt"

      # ==========================================================
      # 21. UPLOAD RECOVERY
      # ==========================================================

      - name: Upload TWRP recovery
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-cupid-Nndee-V2
          path: |
            output/recovery.img
            output/recovery.img.sha256
            output/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 22. UPLOAD DEBUG CONFIGURATION
      # ==========================================================

      - name: Upload device configuration for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cupid-build-debug
          path: |
            twrp/device/xiaomi/cupid/BoardConfig.mk
            twrp/device/xiaomi/cupid/device.mk
            twrp/device/xiaomi/cupid/twrp_cupid.mk
            twrp/device/xiaomi/cupid/AndroidProducts.mk
          if-no-files-found: warn
          retention-days: 14
